name: Web

# Builds the browser version (Unity WebGL, installable and playable offline), checks it really starts in
# headless Chrome on a desktop and a phone screen, and publishes it to GitHub Pages only when asked:
# Actions > Web > Run workflow > publish = true. Uses the same Unity secrets as CI (see ci.yml).
on:
  push:
    branches: [main, "release/**", "web/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Unity secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repo secrets so the web build can run."
            exit 1
          fi

      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          buildMethod: BlockDrop.EditorTools.WebBuild.Build
          buildName: BlockDrop
          versioning: None

      - name: Fix build file ownership
        run: sudo chown -R "$(id -u):$(id -g)" build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test in headless Chrome
        working-directory: tools/web-smoke
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node smoke.mjs "$GITHUB_WORKSPACE/build/WebGL/BlockDrop" "$GITHUB_WORKSPACE/build/smoke"

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-${{ github.run_number }}
          path: build/smoke
          retention-days: 14
          if-no-files-found: ignore

      - name: Package for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/BlockDrop
          retention-days: 14

  deploy-web:
    needs: build-web
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
