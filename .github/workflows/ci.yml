name: CI

# Runs the EditMode tests and builds a signed Android App Bundle in the cloud, so changes are checked
# without a Mac. The job is named `test-and-build` to match the check main's branch protection expects.
# Repo secrets (Settings > Secrets and variables > Actions), added by the owner:
#   UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD         Unity activation (contents of Unity_lic.ulf)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS,
#   ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS       the same upload key Unity Build Automation uses
on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Cloud Code rule tests
        if: hashFiles('CloudCode/*.test.js') != ''
        run: node --test CloudCode/

      - name: Check Unity secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repo secrets so CI can run Unity."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-

      - name: EditMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
          githubToken: ${{ github.token }}
          checkName: EditMode test results

      - name: Free disk space for the Android image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Version code
        id: version
        # Above 100 so it never collides with the versionCode 1 builds from Unity Build Automation.
        run: echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build Android App Bundle
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          androidExportType: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'androidAppBundle' || 'androidPackage' }}
          androidKeystoreName: upload.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          androidSymbolType: public
          # 1.0.0 stays the player-facing version; the code only has to grow with each upload.
          versioning: None
          androidVersionCode: ${{ steps.version.outputs.code }}
          buildName: BlockDrop

      - uses: actions/upload-artifact@v4
        with:
          name: BlockDrop-android-${{ github.run_number }}
          path: build/Android
          retention-days: 14
