name: Rules tests

# Plain .NET run of the pure C# rules and their tests on every push to a claude/** branch.
# No Unity build and no secrets, so it works without a Unity licence.
on:
  push:
    branches: ["claude/**"]

permissions:
  contents: read

concurrency:
  group: rules-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tools/CoreTests
