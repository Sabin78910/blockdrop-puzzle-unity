name: Unity CI

# Uses GameCI. Needs repo secrets UNITY_LICENSE (or UNITY_SERIAL), UNITY_EMAIL, UNITY_PASSWORD.
# See https://game.ci/docs/github/activation  — skips cleanly until they exist.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      HAS_LICENSE: ${{ secrets.UNITY_EMAIL != '' }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - if: env.HAS_LICENSE != 'true'
        run: echo "::notice::Unity license secrets not set — skipping. See README."
      - if: env.HAS_LICENSE == 'true'
        uses: actions/checkout@v4
        with:
          lfs: true
      - if: env.HAS_LICENSE == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
      - if: env.HAS_LICENSE == 'true'
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: 6000.6.5f1  # GameCI has no image for 6000.6.2f1; patch-compatible
          testMode: editmode
          githubToken: ${{ github.token }}
      - if: env.HAS_LICENSE == 'true'
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 6000.6.5f1
          targetPlatform: Android
          buildMethod: BlockDrop.EditorTools.BuildScript.BuildAndroid
      - if: env.HAS_LICENSE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blockdrop-android
          path: build/Android
